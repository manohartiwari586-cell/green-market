<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Market - Checkout</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chatbot.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f5f3;
}

header{
background:#1b5e20;
color:white;
text-align:center;
padding:18px;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
max-width:700px;
margin:25px auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
color:#1b5e20;
margin-bottom:15px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
color:#333;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin-top:6px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

textarea{
resize:none;
height:90px;
}

.summary{
background:#f8f8f8;
padding:15px;
border-radius:10px;
margin-top:20px;
}

.summary p{
font-size:18px;
margin:8px 0;
}

button{
width:100%;
margin-top:20px;
padding:15px;
background:#2e7d32;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1b5e20;
}
.qr-section {
    display: none;
    margin-top: 20px;
    padding: 20px;
    text-align: center;
    background: #f8fff8;
    border: 2px solid #2e7d32;
    border-radius: 15px;
    width: 280px;
}

.qr-section img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    border-radius: 10px;
}

.qr-section h3 {
    color: #2e7d32;
    margin-bottom: 15px;
}

.qr-section p {
    font-size: 14px;
    color: #555;
}
</style>

</head>

<body>

<header>
💳 Checkout
</header>

<div class="container">

<h2>Delivery Details</h2>

<label>Full Name</label>
<input type="text" id="name" required>

<label>Mobile Number</label>
<input type="tel" id="mobile" maxlength="10" required>

<label>Email</label>
<input type="email" id="email">

<label>Delivery Address</label>
<textarea id="address"></textarea>

<label>City</label>
<input type="text" id="city">

<label>PIN Code</label>
<input type="number" id="pin">

<h2>Payment Method</h2>

<select id="payment">
    <option value="">Select Payment Method</option>
    <option value="cod">Cash on Delivery</option>
    <option value="bharatpay">Bharat Pay</option>
    <option value="upi">UPI</option>
    <option value="debit">Debit Card</option>
    <option value="credit">Credit Card</option>
</select>

<!-- Bharat Pay QR -->
<div id="qrSection" class="qr-section">
    <h3>Scan & Pay with Bharat Pay</h3>
    <img src="images/qr.jpeg" alt="Bharat Pay QR Code">
    <p>Scan this QR code to make payment</p>
</div>

<div class="summary">

<h2>Order Summary</h2>

<p>Total Items : <b id="items">0</b></p>

<p>Total Amount : <b id="amount">₹0</b></p>

</div>

<button onclick="placeOrder()">

Place Order

</button>

</div>

<script>

let cart=JSON.parse(localStorage.getItem("cart")) || [];

let total=0;

cart.forEach(item=>{

total+=Number(item.price);

});

document.getElementById("items").innerHTML=cart.length;

document.getElementById("amount").innerHTML="₹"+total;

function placeOrder(){

let name=document.getElementById("name").value;
let mobile=document.getElementById("mobile").value;
let address=document.getElementById("address").value;

if(name=="" || mobile=="" || address==""){

alert("Please fill all required fields.");

return;

}

let orderId="GM"+Math.floor(Math.random()*1000000);

localStorage.setItem("orderId",orderId);

localStorage.removeItem("cart");

window.location.href="order_success.html";

}
const payment = document.getElementById("payment");
const qrSection = document.getElementById("qrSection");

payment.addEventListener("change", function () {

    if (this.value === "bharatpay") {
        qrSection.style.display = "block";
    } else {
        qrSection.style.display = "none";
    }

});

</script>
<script src="script.js"></script>
<!-- ================= CHATBOT ================= -->

<button id="chatbotBtn" class="chatbot-btn">💬</button>

<div id="chatbot" class="chatbot">

    <!-- Header -->
    <div class="chat-header">

        <div>
            <h3>🤖 GreenBot</h3>
            <span>Online • Green Market</span>
        </div>

        <button id="closeChat">✕</button>

    </div>


    <!-- Messages -->
    <div id="chatMessages" class="chat-messages">

        <div class="bot-message">
            👋 Hello! Welcome to Green Market.<br>
            How can I help you?
        </div>

    </div>


    <!-- Quick Buttons -->
    <div class="quick-buttons">

        <button onclick="quickMessage('Products')">
            🛍️ Products
        </button>

        <button onclick="quickMessage('Deals')">
            🔥 Deals
        </button>

        <button onclick="quickMessage('Cart')">
            🛒 Cart
        </button>

        <button onclick="quickMessage('Payment')">
            💳 Payment
        </button>

    </div>


    <!-- Input -->
    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
        >

        <button id="sendBtn">➤</button>

    </div>

</div>

<!-- ================= END CHATBOT ================= -->


<script src="chatbot.js"></script>

</body>
</html>
