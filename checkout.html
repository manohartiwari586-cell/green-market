<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Market - Checkout</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="chatbot.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f5f3;
}

header {
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 18px;
    font-size: 28px;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 700px;
    margin: 25px auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,.2);
}

h2 {
    color: #1b5e20;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

textarea {
    resize: none;
    height: 90px;
}

.summary {
    background: #f8f8f8;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
}

.summary p {
    font-size: 18px;
    margin: 8px 0;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

.qr-section {
    display: none;
    margin-top: 20px;
    padding: 20px;
    text-align: center;
    background: #f8fff8;
    border: 2px solid #2e7d32;
    border-radius: 15px;
    width: 280px;
    max-width: 100%;
}

.qr-section img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    border-radius: 10px;
}

.qr-section h3 {
    color: #2e7d32;
    margin-bottom: 15px;
}

.qr-section p {
    font-size: 14px;
    color: #555;
}
</style>
</head>

<body>

<header>💳 Checkout</header>

<div class="container">

<h2>Delivery Details</h2>

<label for="name">Full Name</label>
<input type="text" id="name" required>

<label for="mobile">Mobile Number</label>
<input type="tel" id="mobile" maxlength="10" required>

<label for="email">Email</label>
<input type="email" id="email">

<label for="address">Delivery Address</label>
<textarea id="address" required></textarea>

<label for="city">City</label>
<input type="text" id="city">

<label for="pin">PIN Code</label>
<input type="number" id="pin">

<h2 style="margin-top:25px;">Payment Method</h2>

<select id="payment">
    <option value="">Select Payment Method</option>
    <option value="cod">Cash on Delivery</option>
    <option value="bharatpay">Bharat Pay</option>
    <option value="upi">UPI</option>
    <option value="debit">Debit Card</option>
    <option value="credit">Credit Card</option>
</select>

<div id="qrSection" class="qr-section">
    <h3>Scan & Pay with Bharat Pay</h3>
    <img src="images/qr.jpeg" alt="Bharat Pay QR Code">
    <p>Scan this QR code to make payment</p>
</div>

<div class="summary">

    <h2>Order Summary</h2>

    <p>Total Items: <b id="items">0</b></p>

    <p>Total Amount: <b id="amount">₹0.00</b></p>

</div>

<button type="button" onclick="placeOrder()">
    Place Order
</button>

</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function getPrice(item) {
    return parseFloat(
        String(item.price ?? "0").replace(/[^\d.]/g, "")
    ) || 0;
}

function getQty(item) {
    return Math.max(1, parseInt(item.qty, 10) || 1);
}

function updateOrderSummary() {

    // Total quantity of all products
    const totalItems = cart.reduce(function(total, item) {
        return total + getQty(item);
    }, 0);

    // Total price = unit price x quantity
    const totalAmount = cart.reduce(function(total, item) {
        return total + getPrice(item) * getQty(item);
    }, 0);

    document.getElementById("items").textContent = totalItems;

    document.getElementById("amount").textContent =
        "₹" + totalAmount.toFixed(2);
}

updateOrderSummary();

function placeOrder() {

    // Refresh cart in case it changed
    cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty. Please add products first.");
        return;
    }

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const address = document.getElementById("address").value.trim();

    if (name === "" || mobile === "" || address === "") {
        alert("Please fill your name, mobile number and delivery address.");
        return;
    }

    if (!/^\d{10}$/.test(mobile)) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
    }

    // Calculate correct amount before placing the order
    const totalAmount = cart.reduce(function(total, item) {
        return total + getPrice(item) * getQty(item);
    }, 0);

    const orderId = "GM" + Math.floor(Math.random() * 1000000);

    // Save order information for the success page
    localStorage.setItem("orderId", orderId);
    localStorage.setItem("orderTotal", totalAmount.toFixed(2));
    localStorage.setItem("orderItems", JSON.stringify(cart));

    localStorage.removeItem("cart");

    window.location.href = "order_success.html";
}

const payment = document.getElementById("payment");
const qrSection = document.getElementById("qrSection");

payment.addEventListener("change", function() {
    qrSection.style.display =
        this.value === "bharatpay" ? "block" : "none";
});
</script>

<!-- Chatbot -->
<button id="chatbotBtn" class="chatbot-btn">💬</button>

<div id="chatbot" class="chatbot">

    <div class="chat-header">
        <div>
            <h3>🤖 GreenBot</h3>
            <span>Online • Green Market</span>
        </div>
        <button id="closeChat">✕</button>
    </div>

    <div id="chatMessages" class="chat-messages">
        <div class="bot-message">
            👋 Hello! Welcome to Green Market.<br>
            How can I help you?
        </div>
    </div>

    <div class="quick-buttons">
        <button onclick="quickMessage('Products')">🛍️ Products</button>
        <button onclick="quickMessage('Deals')">🔥 Deals</button>
        <button onclick="quickMessage('Cart')">🛒 Cart</button>
        <button onclick="quickMessage('Payment')">💳 Payment</button>
    </div>

    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Type your message...">
        <button id="sendBtn">➤</button>
    </div>

</div>

<script src="chatbot.js"></script>

</body>
</html>
