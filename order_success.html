<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Successful</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#f4fff4;

}

.card{

background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.2);
text-align:center;
max-width:450px;

}

.icon{

font-size:80px;

}

h1{

color:#2e7d32;
margin:15px 0;

}

p{

font-size:18px;
color:#555;
margin:10px 0;

}

button{

margin-top:20px;
padding:15px 30px;
background:#2e7d32;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;

}

button:hover{

background:#1b5e20;

}

</style>

</head>

<body>

<div class="card">

<div class="icon">✅</div>

<h1>Order Placed Successfully!</h1>

<p>Thank you for shopping with Green Market.</p>

<p>Your order will be delivered soon.</p>

<h3 id="orderId"></h3>

<button onclick="window.location.href='products.html'">

Continue Shopping

</button>

</div>

<script>

let orderId=localStorage.getItem("orderId");

document.getElementById("orderId").innerHTML="Order ID : "+orderId;

</script>

</body>
</html>
