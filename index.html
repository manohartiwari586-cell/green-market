
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Market - Register</title>
<link rel="stylesheet" href="register.css">
<link rel="stylesheet" href="chatbot.css">
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <form id="registerForm">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="tel" id="mobile" placeholder="Mobile Number" maxlength="10" required>

        <input type="password" id="password" placeholder="Password" required>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="register.js"></script>
<!-- ================= CHATBOT ================= -->

<button id="chatbotBtn" class="chatbot-btn">💬</button>

<div id="chatbot" class="chatbot">

    <!-- Header -->
    <div class="chat-header">

        <div>
            <h3>🤖 GreenBot</h3>
            <span>Online • Green Market</span>
        </div>

        <button id="closeChat">✕</button>

    </div>


    <!-- Messages -->
    <div id="chatMessages" class="chat-messages">

        <div class="bot-message">
            👋 Hello! Welcome to Green Market.<br>
            How can I help you?
        </div>

    </div>


    <!-- Quick Buttons -->
    <div class="quick-buttons">

        <button onclick="quickMessage('Products')">
            🛍️ Products
        </button>

        <button onclick="quickMessage('Deals')">
            🔥 Deals
        </button>

        <button onclick="quickMessage('Cart')">
            🛒 Cart
        </button>

        <button onclick="quickMessage('Payment')">
            💳 Payment
        </button>

    </div>


    <!-- Input -->
    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
        >

        <button id="sendBtn">➤</button>

    </div>

</div>

<!-- ================= END CHATBOT ================= -->

<script src="chatbot.js"></script>


</body>
</html>
