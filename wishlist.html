<!DOCTYPE html>
<html>
<head>

<title>Wishlist</title>
<link rel="stylesheet" href="chatbot.css">
<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:0;

padding:20px;

}

h1{

text-align:center;

color:green;

}

#wishlistContainer{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

.card{

background:white;

padding:15px;

border-radius:10px;

box-shadow:0 0 10px #ccc;

text-align:center;

}

.card img{

width:150px;

height:150px;

object-fit:contain;

}

button{

margin:5px;

padding:10px 20px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:first-of-type{

background:green;

color:white;

}

button:last-of-type{

background:red;

color:white;

}

</style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

<div id="wishlistContainer"></div>
<p>Hello Bhai</p>

<script src="wishlist.js"></script>
<!-- ================= CHATBOT ================= -->

<button id="chatbotBtn" class="chatbot-btn">💬</button>

<div id="chatbot" class="chatbot">

    <!-- Header -->
    <div class="chat-header">

        <div>
            <h3>🤖 GreenBot</h3>
            <span>Online • Green Market</span>
        </div>

        <button id="closeChat">✕</button>

    </div>


    <!-- Messages -->
    <div id="chatMessages" class="chat-messages">

        <div class="bot-message">
            👋 Hello! Welcome to Green Market.<br>
            How can I help you?
        </div>

    </div>


    <!-- Quick Buttons -->
    <div class="quick-buttons">

        <button onclick="quickMessage('Products')">
            🛍️ Products
        </button>

        <button onclick="quickMessage('Deals')">
            🔥 Deals
        </button>

        <button onclick="quickMessage('Cart')">
            🛒 Cart
        </button>

        <button onclick="quickMessage('Payment')">
            💳 Payment
        </button>

    </div>


    <!-- Input -->
    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
        >

        <button id="sendBtn">➤</button>

    </div>

</div>

<!-- ================= END CHATBOT ================= -->


<script src="chatbot.js"></script>
<script src="chatbot.js"></script>
</body>

</html>
