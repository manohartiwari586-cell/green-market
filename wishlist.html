<!DOCTYPE html>
<html>
<head>

<title>Wishlist</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

margin:0;

padding:20px;

}

h1{

text-align:center;

color:green;

}

#wishlistContainer{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(250px,1fr));

gap:20px;

}

.card{

background:white;

padding:15px;

border-radius:10px;

box-shadow:0 0 10px #ccc;

text-align:center;

}

.card img{

width:150px;

height:150px;

object-fit:contain;

}

button{

margin:5px;

padding:10px 20px;

border:none;

border-radius:5px;

cursor:pointer;

}

button:first-of-type{

background:green;

color:white;

}

button:last-of-type{

background:red;

color:white;

}

</style>

</head>

<body>

<h1>❤️ My Wishlist</h1>

<div id="wishlistContainer"></div>

<script src="wishlist.js"></script>

</body>

</html>
