
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f4;
}

header{
background:#1b5e20;
color:white;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.container{
width:90%;
max-width:900px;
margin:25px auto;
}

.cart-item{

display:flex;
align-items:center;
justify-content:space-between;

background:white;

padding:15px;

margin-bottom:20px;

border-radius:12px;

box-shadow:0 4px 10px rgba(0,0,0,.15);

}

.cart-item img{

width:90px;

height:90px;

border-radius:10px;

object-fit:cover;

}

.details{

flex:1;

margin-left:20px;

}

.details h3{

color:#1b5e20;

margin-bottom:8px;

}

.price{

font-size:20px;

color:red;

font-weight:bold;

margin-bottom:10px;

}

.qty button{

width:30px;

height:30px;

border:none;

background:#2e7d32;

color:white;

border-radius:50%;

cursor:pointer;

}

.qty span{

margin:0 10px;

font-size:18px;

}

.remove{

background:red;

color:white;

border:none;

padding:10px 15px;

border-radius:8px;

cursor:pointer;

}

.summary{

background:white;

padding:20px;

border-radius:12px;

box-shadow:0 4px 10px rgba(0,0,0,.15);

}

.summary h2{

color:#1b5e20;

margin-bottom:15px;

}

.summary p{

font-size:18px;

margin:10px 0;

}

.checkout{

width:100%;

margin-top:20px;

padding:15px;

background:#1b5e20;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

}

.checkout:hover{

background:#2e7d32;

}

</style>

</head>

<body>

<header>

🛒 My Shopping Cart

</header>

<div class="container">

<div id="cartItems"></div>

<div class="summary">

<h2>Order Summary</h2>

<p>Total Items : <b id="totalItems">0</b></p>

<p>Total Price : <b id="totalPrice">₹0</b></p>

<button class="checkout"
onclick="location.href='checkout.html'">
Proceed To Checkout
</button>

</div>

</div>
<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let cartItems = document.getElementById("cartItems");

let total = 0;

cart.forEach(item=>{

total += Number(item.price);

cartItems.innerHTML += `

<div class="cart-item">

<img src="${item.image}">

<div class="details">

<h3>${item.name}</h3>

<p class="price">₹${item.price}</p>

<div class="qty">

<span>Qty : ${item.qty}</span>

</div>

</div>

<button class="remove" onclick="removeItem('${item.name}')">
Remove
</button>

</div>

`;

});

document.getElementById("totalItems").innerHTML = cart.length;

document.getElementById("totalPrice").innerHTML = "₹" + total;

function removeItem(name){

cart = cart.filter(item=>item.name!==name);

localStorage.setItem("cart",JSON.stringify(cart));

location.reload();

}

</script>

</body>

</html>
